name: Static Site CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required files exist
        run: |
          for f in index.html manifest.json service-worker.js; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing required file: $f"
              exit 1
            fi
            echo "✅ Found: $f"
          done

      - name: Basic HTML sanity check
        run: |
          for f in *.html; do
            if ! grep -qi "<html" "$f"; then
              echo "❌ $f has no <html> tag"
              exit 1
            fi
            echo "✅ $f looks like HTML"
          done

      - name: PWA manifest sanity check
        run: |
          if ! grep -q '"name"' manifest.json; then
            echo "❌ manifest.json missing name field"
            exit 1
          fi
          echo "✅ manifest.json has name field"
